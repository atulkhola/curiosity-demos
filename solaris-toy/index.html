<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solaris concept toy (not Runway)</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; background: #0b0d10; color: #e8eaed; min-height: 100vh; display: grid; place-items: center; }
    .wrap { width: min(920px, 96vw); display: grid; gap: 12px; }
    h1 { font-size: 1rem; font-weight: 600; margin: 0; letter-spacing: 0.02em; }
    p { margin: 0; opacity: 0.75; font-size: 0.85rem; line-height: 1.4; }
    .stage {
      position: relative; aspect-ratio: 16/10; border-radius: 14px; overflow: hidden;
      border: 1px solid #2a3038; background: #12161c; cursor: crosshair; touch-action: none;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .hud {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between;
    }
    .pill {
      font-size: 0.75rem; padding: 6px 10px; border-radius: 999px; background: #1a2028; border: 1px solid #2f3742;
    }
    input[type="text"] {
      flex: 1; min-width: 180px; background: #151a21; border: 1px solid #2f3742; color: inherit;
      border-radius: 10px; padding: 8px 10px; font: inherit;
    }
    button {
      background: #3d7eff; color: white; border: 0; border-radius: 10px; padding: 8px 12px; font: inherit; cursor: pointer;
    }
    button.secondary { background: #232a33; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Interface world-model toy</h1>
    <p>Educational stand-in for Runway Solaris: each pointer action conditions the next painted “frame.” No video model — procedural UI pixels only.</p>
    <div class="hud">
      <span class="pill" id="framePill">frame 0</span>
      <span class="pill" id="modePill">mode: browse</span>
      <input id="intent" type="text" value="open a travel map and zoom the coast" aria-label="intent" />
      <button id="apply">Apply intent</button>
      <button class="secondary" id="reset">Reset</button>
    </div>
    <div class="stage"><canvas id="c" width="1280" height="800"></canvas></div>
  </div>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const framePill = document.getElementById('framePill');
    const modePill = document.getElementById('modePill');
    const intentInput = document.getElementById('intent');

    let frame = 0;
    let mode = 'browse'; // browse | map | notes
    let zoom = 1;
    let pan = { x: 0, y: 0 };
    let pointer = { x: 0.5, y: 0.5, down: false };
    let last = null;

    function hash(s) {
      let h = 2166136261;
      for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
      return h >>> 0;
    }

    function intentToMode(text) {
      const t = text.toLowerCase();
      if (t.includes('map') || t.includes('coast') || t.includes('travel')) return 'map';
      if (t.includes('note') || t.includes('write') || t.includes('doc')) return 'notes';
      return 'browse';
    }

    function drawChrome(seed) {
      const g = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      g.addColorStop(0, '#141a22');
      g.addColorStop(1, '#0e1218');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // fake window chrome
      ctx.fillStyle = '#1c2430';
      roundRect(40, 36, canvas.width - 80, canvas.height - 72, 18);
      ctx.fill();
      ctx.fillStyle = '#10151c';
      roundRect(40, 36, canvas.width - 80, 44, 18);
      ctx.fill();
      ctx.beginPath();
      [['#ff5f57', 64], ['#febc2e', 88], ['#28c840', 112]].forEach(([c, x]) => {
        ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, 58, 7, 0, Math.PI * 2); ctx.fill();
      });
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawBrowse(seed) {
      const cards = 6;
      for (let i = 0; i < cards; i++) {
        const col = i % 3, row = Math.floor(i / 3);
        const x = 80 + col * 370 + pan.x * 20;
        const y = 120 + row * 280 + pan.y * 20;
        ctx.fillStyle = i === Math.floor(pointer.x * cards) % cards ? '#2a3a55' : '#18212c';
        roundRect(x, y, 330, 240, 14); ctx.fill();
        ctx.fillStyle = '#6ea8ff';
        ctx.font = '600 22px ui-sans-serif';
        ctx.fillText(['Inbox', 'Calendar', 'Maps', 'Notes', 'Photos', 'Music'][i], x + 24, y + 48);
        ctx.fillStyle = '#8b93a1';
        ctx.font = '16px ui-sans-serif';
        ctx.fillText('generated surface · frame ' + frame, x + 24, y + 84);
      }
    }

    function drawMap(seed) {
      ctx.save();
      ctx.translate(canvas.width / 2 + pan.x * 120, canvas.height / 2 + pan.y * 80);
      ctx.scale(zoom, zoom);
      // coast-ish blobs
      for (let i = 0; i < 18; i++) {
        const a = ((seed + i * 97) % 360) * Math.PI / 180;
        const r = 80 + (seed % 50) + i * 7;
        ctx.fillStyle = i % 2 ? '#1f6f6a' : '#245b8a';
        ctx.beginPath();
        ctx.ellipse(Math.cos(a) * r, Math.sin(a) * r * 0.6, 90 - i * 3, 48, a, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#d7e6ff';
      ctx.font = '700 28px ui-sans-serif';
      ctx.fillText('COAST', -40, 10);
      ctx.restore();
      ctx.fillStyle = 'rgba(61,126,255,0.35)';
      ctx.beginPath();
      ctx.arc(pointer.x * canvas.width, pointer.y * canvas.height, 18, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawNotes(seed) {
      ctx.fillStyle = '#f4efe6';
      roundRect(120, 110, canvas.width - 240, canvas.height - 180, 10); ctx.fill();
      ctx.fillStyle = '#222';
      ctx.font = '700 34px Georgia, serif';
      ctx.fillText('Field notes', 160, 180);
      ctx.font = '18px ui-sans-serif';
      const lines = [
        'Intent steers layout semantics.',
        'Pointer events condition the next frame.',
        'No DOM app — only painted pixels.',
        'Frame coherence is faked with shared state.'
      ];
      lines.forEach((line, i) => ctx.fillText(line, 160, 230 + i * 36));
      ctx.strokeStyle = '#3d7eff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(pointer.x * canvas.width, 110);
      ctx.lineTo(pointer.x * canvas.width, canvas.height - 70);
      ctx.stroke();
    }

    function render() {
      const seed = hash(mode + ':' + frame + ':' + intentInput.value);
      drawChrome(seed);
      if (mode === 'map') drawMap(seed);
      else if (mode === 'notes') drawNotes(seed);
      else drawBrowse(seed);
      framePill.textContent = 'frame ' + frame;
      modePill.textContent = 'mode: ' + mode + ' · zoom ' + zoom.toFixed(2);
    }

    function bump(action) {
      frame += 1;
      if (action === 'drag' && mode === 'map') {
        // already updated pan
      }
      if (action === 'wheel' && mode === 'map') {
        // zoom already updated
      }
      render();
    }

    function toLocal(e) {
      const r = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - r.left) / r.width,
        y: (e.clientY - r.top) / r.height
      };
    }

    canvas.addEventListener('pointerdown', (e) => {
      pointer = { ...toLocal(e), down: true };
      last = { x: e.clientX, y: e.clientY };
      bump('click');
    });
    canvas.addEventListener('pointermove', (e) => {
      const p = toLocal(e);
      pointer.x = p.x; pointer.y = p.y;
      if (!pointer.down || !last) return;
      pan.x += (e.clientX - last.x) / 200;
      pan.y += (e.clientY - last.y) / 200;
      last = { x: e.clientX, y: e.clientY };
      bump('drag');
    });
    window.addEventListener('pointerup', () => { pointer.down = false; last = null; });
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (mode !== 'map') return;
      zoom = Math.min(3, Math.max(0.6, zoom * (e.deltaY < 0 ? 1.08 : 0.92)));
      bump('wheel');
    }, { passive: false });

    document.getElementById('apply').onclick = () => {
      mode = intentToMode(intentInput.value);
      pan = { x: 0, y: 0 }; zoom = 1;
      bump('intent');
    };
    document.getElementById('reset').onclick = () => {
      mode = 'browse'; pan = { x: 0, y: 0 }; zoom = 1; frame = 0; render();
    };

    render();
  </script>
</body>
</html>
