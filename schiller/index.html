<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schiller (first pass)</title>
<meta name="theme-color" content="#050508">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #050508;
    font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    color: #e8e6f0;
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
    touch-action: none;
  }
  .hud {
    position: fixed;
    left: 1.25rem;
    bottom: 1.25rem;
    z-index: 2;
    max-width: min(22rem, calc(100vw - 2.5rem));
    padding: 1rem 1.15rem 1.1rem;
    border-radius: 14px;
    background: rgba(8, 8, 14, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(16px) saturate(1.2);
    -webkit-backdrop-filter: blur(16px) saturate(1.2);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    pointer-events: auto;
  }
  .hud h1 {
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-bottom: 0.15rem;
  }
  .hud p {
    font-size: 0.72rem;
    opacity: 0.55;
    margin-bottom: 0.85rem;
    line-height: 1.35;
  }
  .row {
    display: grid;
    grid-template-columns: 5.5rem 1fr 2.6rem;
    gap: 0.55rem;
    align-items: center;
    margin-bottom: 0.55rem;
  }
  .row:last-child { margin-bottom: 0; }
  .row label {
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    opacity: 0.7;
  }
  .row output {
    font-size: 0.72rem;
    font-variant-numeric: tabular-nums;
    text-align: right;
    opacity: 0.85;
  }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.12);
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: linear-gradient(135deg, #c9b8ff, #7ee0ff);
    box-shadow: 0 0 10px rgba(126, 224, 255, 0.45);
    border: none;
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: linear-gradient(135deg, #c9b8ff, #7ee0ff);
    border: none;
  }
  .hint {
    position: fixed;
    top: 1.1rem;
    right: 1.25rem;
    font-size: 0.68rem;
    opacity: 0.4;
    letter-spacing: 0.03em;
    z-index: 2;
    pointer-events: none;
  }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hint">drag to orbit · thin-film iridescence</div>
  <div class="hud">
    <h1>Schiller (first pass)</h1>
    <p>View-dependent spectral colors from optical path difference — oil-slick / labradorite vibe.</p>
    <div class="row">
      <label for="thickness">Thickness</label>
      <input id="thickness" type="range" min="120" max="900" step="1" value="380">
      <output id="thicknessOut">380 nm</output>
    </div>
    <div class="row">
      <label for="ior">IOR</label>
      <input id="ior" type="range" min="1.15" max="1.85" step="0.01" value="1.45">
      <output id="iorOut">1.45</output>
    </div>
    <div class="row">
      <label for="animate">Animate</label>
      <input id="animate" type="range" min="0" max="1" step="1" value="1">
      <output id="animateOut">on</output>
    </div>
  </div>

<script src="./main.js"></script>

</body>
</html>
