<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Kinetic Explosion Type</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      margin: 0; 
      overflow: hidden; 
      background: #fff; 
      touch-action: none;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    canvas { display: block; }
    .credit {
      position: fixed;
      bottom: 12px;
      left: 12px;
      color: rgba(0, 0, 0, 0.4);
      font-size: 11px;
      pointer-events: none;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    .credit a {
      color: rgba(0, 0, 0, 0.6);
      text-decoration: none;
      pointer-events: auto;
    }
    .hint {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(0, 0, 0, 0.4);
      font-size: 13px;
      pointer-events: none;
      animation: fadeOut 4s forwards;
      text-align: center;
      padding: 0 20px;
    }
    @keyframes fadeOut {
      0%, 50% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="hint">Move cursor or tap to warp typography</div>
  <div class="credit">
    Inspired by <a href="https://www.instagram.com/kiel.d.m/" target="_blank" rel="noopener">@kiel.d.m</a> / Space Type Generator R&D
  </div>
  
  <script>
    let phrase = "A NEW HISTORY TAKES SHAPE EXPLORE UNKNOWNS";
    let words = [];
    let explosionX = -1000;
    let explosionY = -1000;
    let explosionForce = 0;
    let targetForce = 0;
    let mouseActive = false;
    
    function setup() {
      createCanvas(windowWidth, windowHeight);
      textFont('Arial Black, Impact, sans-serif');
      
      layoutWords();
    }
    
    function layoutWords() {
      words = [];
      let txtSize = width < 600 ? width * 0.085 : width * 0.065;
      
      let wordList = phrase.split(' ');
      let yPos = height * 0.25;
      let lineHeight = txtSize * 1.4;
      let maxWidth = width * 0.9;
      
      let currentLine = [];
      
      for (let word of wordList) {
        currentLine.push(word);
        let lineText = currentLine.join(' ');
        textSize(txtSize);
        let lineWidth = textWidth(lineText);
        
        if (lineWidth > maxWidth && currentLine.length > 1) {
          currentLine.pop();
          addLineWords(currentLine, width / 2, yPos, txtSize);
          yPos += lineHeight;
          currentLine = [word];
        }
      }
      
      if (currentLine.length > 0) {
        addLineWords(currentLine, width / 2, yPos, txtSize);
      }
    }
    
    function addLineWords(lineWords, centerX, y, size) {
      let lineText = lineWords.join(' ');
      textSize(size);
      let totalWidth = textWidth(lineText);
      let x = centerX - totalWidth / 2;
      
      for (let word of lineWords) {
        let chars = word.split('');
        for (let char of chars) {
          let charWidth = textWidth(char);
          words.push({
            char: char,
            x: x + charWidth / 2,
            y: y,
            size: size
          });
          x += charWidth;
        }
        x += textWidth(' ');
      }
    }
    
    function draw() {
      // CRITICAL: Clear canvas every frame
      background(255);
      
      // Smooth force decay
      explosionForce = lerp(explosionForce, targetForce, 0.12);
      if (!mouseActive) {
        targetForce *= 0.85;
      }
      
      // Draw blast effect first (behind text)
      if (explosionForce > 0.1 && mouseActive) {
        drawBlastEffect();
      }
      
      // Draw each character with displacement
      fill(0);
      noStroke();
      
      for (let w of words) {
        push();
        
        // Calculate displacement from explosion center
        let dx = w.x - explosionX;
        let dy = w.y - explosionY;
        let dist = sqrt(dx * dx + dy * dy);
        let maxDist = 250;
        
        let dispX = 0;
        let dispY = 0;
        let scaleAmount = 1;
        let rotAmount = 0;
        
        if (dist < maxDist && explosionForce > 0) {
          let force = explosionForce * (1 - dist / maxDist);
          let angle = atan2(dy, dx);
          
          // Displacement outward
          dispX = cos(angle) * force * 60;
          dispY = sin(angle) * force * 60;
          
          // Scale and rotation based on force
          scaleAmount = 1 + force * 0.4;
          rotAmount = force * 0.15 * (random() > 0.5 ? 1 : -1);
        }
        
        // Apply transformations
        translate(w.x + dispX, w.y + dispY);
        rotate(rotAmount);
        scale(scaleAmount);
        
        textSize(w.size);
        textAlign(CENTER, CENTER);
        text(w.char, 0, 0);
        
        pop();
      }
    }
    
    function drawBlastEffect() {
      push();
      
      // Radial action lines
      stroke(0);
      strokeWeight(3);
      let numLines = 12;
      let innerRad = 25;
      let outerRad = 50 + explosionForce * 40;
      
      for (let i = 0; i < numLines; i++) {
        let angle = (TWO_PI / numLines) * i + frameCount * 0.05;
        let x1 = explosionX + cos(angle) * innerRad;
        let y1 = explosionY + sin(angle) * innerRad;
        let x2 = explosionX + cos(angle) * outerRad;
        let y2 = explosionY + sin(angle) * outerRad;
        line(x1, y1, x2, y2);
      }
      
      // Jagged blast cloud outline
      noFill();
      stroke(0);
      strokeWeight(4);
      beginShape();
      let cloudRad = 20 + explosionForce * 20;
      let points = 16;
      for (let i = 0; i <= points; i++) {
        let angle = (TWO_PI / points) * i;
        let r = cloudRad + random(-8, 8);
        let x = explosionX + cos(angle) * r;
        let y = explosionY + sin(angle) * r;
        vertex(x, y);
      }
      endShape(CLOSE);
      
      // Inner burst circle
      noFill();
      strokeWeight(2);
      circle(explosionX, explosionY, 15 + explosionForce * 15);
      
      pop();
    }
    
    function updateExplosion(x, y) {
      explosionX = x;
      explosionY = y;
      targetForce = 1.5;
      mouseActive = true;
    }
    
    function mouseMoved() {
      updateExplosion(mouseX, mouseY);
      return false;
    }
    
    function mouseDragged() {
      updateExplosion(mouseX, mouseY);
      return false;
    }
    
    function touchMoved() {
      if (touches.length > 0) {
        updateExplosion(touches[0].x, touches[0].y);
      }
      return false;
    }
    
    function touchStarted() {
      if (touches.length > 0) {
        updateExplosion(touches[0].x, touches[0].y);
      }
      return false;
    }
    
    function mouseReleased() {
      mouseActive = false;
      return false;
    }
    
    function touchEnded() {
      mouseActive = false;
      return false;
    }
    
    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      layoutWords();
    }
  </script>
</body>
</html>
