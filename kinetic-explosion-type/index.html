<!doctype html>
<!--
  ST V.CONFLICT — a kinetic type generator
  Study after @kiel.d.m / Space Type Generator (instagram.com/p/DdZx5iIGK58/).

  Build 2026-09-21 (b9df317): full rebuild. The particle / drag-blob sketch is gone.
  - Typography measured off the reference frame: cap height 125px against a 136px
    line advance (0.78em leading), centred, tracking -0.018em.
  - Bubble letters are inflated glyphs: fatten with a round-joined stroke, blur into
    a field, read it back at three thresholds (white sticker rim / ink contour /
    flat colour). Counters and open apertures are found with a flood fill plus a
    morphological closing and carved back out, so E F R S keep their letterform.
  - Pointer is an explosion centre; the opening heap is composed, sleeps until
    disturbed, and recomposes itself once the page goes quiet.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ST V.CONFLICT — a kinetic type generator</title>
<meta name="description" content="Pointer-driven explosion center knocks letters out of a tightly stacked grotesque and inflates them into bubbly 3D type. After @kiel.d.m / Space Type Generator.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%23E9B657' stroke='%23141414' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --chrome: #242424;
    --chrome-2: #323232;
    --chrome-line: #3e3e3e;
    --dim: #8c8c8c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; background: #fff; overflow: hidden;
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    touch-action: none; overscroll-behavior: none;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: none; }

  .hud { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
  .hud > * { pointer-events: auto; }

  /* ---- identity card (top-left), mirrors the generator's own chrome ---- */
  .card {
    position: absolute; top: 16px; left: 16px; width: 232px;
    background: var(--chrome); color: #fff; border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,.20), 0 2px 6px rgba(0,0,0,.14);
    overflow: hidden;
  }
  .card-top { display: flex; align-items: flex-start; gap: 10px; padding: 10px 10px 11px 13px; }
  .id { flex: 1; min-width: 0; }
  .id h1 { font-size: 13.5px; font-weight: 600; letter-spacing: .015em; line-height: 1.15; }
  .id p { margin-top: 3px; font-size: 11px; font-weight: 500; color: var(--dim); line-height: 1.2; }
  .id p a { color: #c9c9c9; text-decoration: underline; text-underline-offset: 2px; }
  .id p a:hover { color: #fff; }
  .chev {
    flex: 0 0 auto; width: 26px; height: 26px; border-radius: 6px; cursor: pointer;
    background: var(--chrome-2); border: 1px solid var(--chrome-line); color: #d6d6d6;
    display: grid; place-items: center; transition: background .15s ease, color .15s ease;
  }
  .chev:hover { background: #3c3c3c; color: #fff; }
  .chev svg { transition: transform .22s cubic-bezier(.4,0,.2,1); }
  .card.open .chev svg { transform: rotate(180deg); }

  .panel { max-height: 0; opacity: 0; transition: max-height .26s cubic-bezier(.4,0,.2,1), opacity .18s ease; }
  .card.open .panel { max-height: 260px; opacity: 1; }
  .panel-in { padding: 2px 13px 13px; border-top: 1px solid rgba(255,255,255,.07); margin-top: 2px; padding-top: 11px; }
  .fld { display: block; margin-bottom: 11px; }
  .fld > span { display: block; font-size: 9.5px; font-weight: 600; letter-spacing: .11em; color: #7d7d7d; margin-bottom: 5px; }
  .fld input {
    width: 100%; background: #1a1a1a; border: 1px solid var(--chrome-line); border-radius: 6px;
    color: #fff; font: 500 11.5px/1.3 "Inter", system-ui, sans-serif; padding: 7px 8px; outline: none;
  }
  .fld input:focus { border-color: #5a5a5a; }
  .swatches { display: flex; gap: 6px; }
  .sw {
    flex: 1; height: 22px; border-radius: 5px; cursor: pointer; overflow: hidden;
    border: 1px solid var(--chrome-line); display: flex; padding: 0; background: none;
  }
  .sw i { flex: 1; display: block; }
  .sw[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 1px rgba(255,255,255,.35); }
  .row { display: flex; gap: 6px; }
  .btn {
    flex: 1; cursor: pointer; background: var(--chrome-2); border: 1px solid var(--chrome-line);
    color: #ddd; border-radius: 6px; padding: 7px 0;
    font: 600 9.5px/1 "Inter", system-ui, sans-serif; letter-spacing: .11em;
    transition: background .15s ease, color .15s ease;
  }
  .btn:hover { background: #454545; color: #fff; }

  /* ---- sound stub (bottom-right), like the post's mute control ---- */
  .sound {
    position: absolute; right: 18px; bottom: 18px; width: 40px; height: 40px; border-radius: 50%;
    background: rgba(26,26,26,.86); border: 0; cursor: pointer; color: #fff; display: grid; place-items: center;
    transition: transform .16s ease, background .16s ease;

  .sound:hover { transform: scale(1.06); background: rgba(26,26,26,.96); }

  .credit {
    position: absolute; left: 18px; bottom: 16px; max-width: 60vw;
    font-size: 10.5px; font-weight: 500; letter-spacing: .01em; color: rgba(0,0,0,.34);
  }
  .credit a { color: rgba(0,0,0,.55); text-decoration: none; border-bottom: 1px solid rgba(0,0,0,.18); }
  .credit a:hover { color: #000; }

  .hint {
    position: absolute; top: 92px; left: 18px;
    font-size: 9.5px; font-weight: 600; letter-spacing: .1em; color: rgba(0,0,0,.34);
    text-transform: uppercase; pointer-events: none; max-width: 200px; line-height: 1.5;
    animation: hintOut 8s forwards;
  }
  @keyframes hintOut { 0%, 62% { opacity: 1; } 100% { opacity: 0; } }
  .hint.off { animation: none; opacity: 0; transition: opacity .4s ease; }

  @media (max-width: 560px) {
    .card { width: 206px; top: 12px; left: 12px; }
    .credit { left: 12px; bottom: 12px; font-size: 9.5px; }
    .sound { right: 12px; bottom: 12px; }
    .hint { top: 84px; left: 14px; font-size: 9px; }
  }
</style>

<body>
<canvas id="stage"></canvas>

<div class="hud">
  <div class="card" id="card">
    <div class="card-top">
      <div class="id">
        <h1>ST V.CONFLICT</h1>
        <p>a generator from <a href="https://www.instagram.com/kiel.d.m/" target="_blank" rel="noopener">kielm</a></p>
      </div>
      <button class="chev" id="chev" aria-label="Toggle controls" aria-expanded="false">

      <path d="M4 7.5h3L11 4v12L7 12.5H4z" fill="currentColor"/>
      <path id="sound-off" d="M13.5 7.5l4 5m0-5l-4 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path id="sound-on" d="M13.6 7.2a4 4 0 010 5.6M15.8 5.2a7 7 0 010 9.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" style="display:none"/>

  <div class="credit">
    Study after <a href="https://www.instagram.com/p/DdZx5iIGK58/" target="_blank" rel="noopener">@kiel.d.m</a> — Space Type Generator / ST V.CONFLICT. Not affiliated.
  </div>
  <div class="hint" id="hint">move into the type<br>click to blast</div>
</div>

<script>
(() => {
'use strict';

/* ══════════════════════════════════════════════════════════════════════════
   0 · CONFIG
   ══════════════════════════════════════════════════════════════════════════ */

// Base stack prefers real Helvetica where it exists (macOS/iOS) — that is the face
// in the reference — and falls back to Inter everywhere else.
const FONT = '"Helvetica Neue", "Inter", Helvetica, Arial, sans-serif';
// Bubble letters are inflated from a black weight: fat stems, wide apertures that
// survive the swell. Inter ships a true 800, so it leads here.
const FONT_FAT = '"Inter", "Helvetica Neue", Helvetica, Arial, sans-serif';

// Measured off the reference frame: cap 125px / line advance 136px → 0.78em leading.
const LEAD    = 0.780;   // line advance in em
const TRACK   = -0.018;  // letter-spacing in em (letters nearly touch)
const CAP_EM  = 0.718;   // cap height fallback if metrics are unavailable

// Inflation. The glyph is first fattened with a round-joined stroke, then blurred
// and read back at two thresholds: T_OUT is the outer contour, T_IN the colour
// edge, and the band between them becomes the ink line. Counters have to survive
// the squeeze — too much of any of these and letters collapse into blobs.
const TUNE = {
  bubble:   1.10,   // inflation adds ~18%, so this lands ~1.35× the base cap
  weight:   800,    // source weight for the inflated letters
  bolden:   0.050,  // pre-blur stroke, as a fraction of glyph size
  blurR:    0.082,  // blur radius, same units
  counterR: 0.022,  // counters and apertures are blurred separately and carved
                    // back out, so the outside swells without eating the letter
  tHalo:    0.232,  // white sticker rim, only visible where letters overlap
  tOut:     0.305,
  tIn:      0.455,
  wobble:   0.030,  // low-frequency threshold noise → hand-inked contour
  rim:      3.2,    // how far the volume shading reaches in from the edge
};

// Sampled straight off the reference frame. Amber repeats because it dominates there.
const PALETTES = {
  kielm: { name: 'KIELM', ink: '#141414', cols: ['#E9B657', '#DF513F', '#66BC77', '#E9B657', '#5A7EBA', '#E7B0C5'] },
  mono:  { name: 'MONO',  ink: '#111111', cols: ['#FFFFFF', '#F4F4F4', '#FFFFFF', '#EDEDED', '#FFFFFF'] },
  volt:  { name: 'VOLT',  ink: '#101010', cols: ['#D8FF3E', '#FF3D7F', '#00C2A8', '#D8FF3E', '#7A5CFF', '#FF6A1F'] },
};

const DEFAULT_PHRASE = 'A NEW / HISTORY / IS HERE / FOR / BEFORE / ANYONE';
const PACK = 0.86;              // contact spacing: letters overlap a little
const MAX_OUT = 14;            // bubbles alive at once; older ones deflate home
const EJECT_GAP = 0.20;        // s between hover knock-outs
const GHOST_GAP = 2.6;         // the unattended demo loop knocks far more slowly
const QUIET = 2.5;             // s of stillness before the poster recomposes itself
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ══════════════════════════════════════════════════════════════════════════
   1 · SMALL MATH
   ══════════════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
const rnd   = (a, b) => a + Math.random() * (b - a);
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const easeOut = t => 1 - Math.pow(1 - t, 3);
function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 10007) / 10007; }

/* ══════════════════════════════════════════════════════════════════════════
   2 · CANVAS
   ══════════════════════════════════════════════════════════════════════════ */

const cvs = document.getElementById('stage');
const ctx = cvs.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;

const measureCvs = document.createElement('canvas');
const measure = measureCvs.getContext('2d');

/* ══════════════════════════════════════════════════════════════════════════
   3 · GLYPH FIELD  —  blur an alpha bitmap of the glyph, then read the field back
   at three thresholds: white sticker rim, ink contour, flat colour. Counters
   shrink to comic slits, and the gradient of the field does the volume shading.
   ══════════════════════════════════════════════════════════════════════════ */

function boxBlur1D(src, dst, w, h, r, vertical) {
  const norm = 1 / (2 * r + 1);
  const outer = vertical ? w : h;
  const inner = vertical ? h : w;
  const stride = vertical ? w : 1;
  for (let o = 0; o < outer; o++) {
    const base = vertical ? o : o * w;
    let sum = 0;
    for (let i = -r; i <= r; i++) sum += src[base + clamp(i, 0, inner - 1) * stride];
    for (let i = 0; i < inner; i++) {
      dst[base + i * stride] = sum * norm;
      sum += src[base + Math.min(i + r + 1, inner - 1) * stride] - src[base + Math.max(i - r, 0) * stride];
    }
  }
}

function blurField(src, w, h, r) {
  let a = Float32Array.from(src), b = new Float32Array(w * h);
  for (let p = 0; p < 3; p++) { boxBlur1D(a, b, w, h, r, false); boxBlur1D(b, a, w, h, r, true); }
  return a;
}

/* Everything the swell would swallow: enclosed counters (O, R, B) plus the thin
   channels between arms (E, F, S, W). Without this the alphabet turns to blobs —
   with it the letterform keeps its skeleton while the outside still inflates. */
function protectedGaps(raw, w, h, r) {
  const ctr = counterRegions(raw, w, h);
  const n = w * h;

  // morphological closing: dilate then erode. What it adds over the raw glyph is
  // exactly the set of gaps narrow enough for the inflation to close.
  const dilF = blurField(raw, w, h, r);
  const dil = new Float32Array(n);
  for (let i = 0; i < n; i++) dil[i] = smooth(0.26, 0.36, dilF[i]);
  const eroF = blurField(dil, w, h, r);

  let any = !!ctr;
  const out = ctr || new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const g = smooth(0.64, 0.76, eroF[i]) - raw[i];
    if (g > out[i]) { out[i] = g; any = true; }
  }
  return any ? out : null;
}

function counterRegions(raw, w, h) {
  const seen = new Uint8Array(w * h);
  const stack = [];
  const push = (x, y) => {
    const i = y * w + x;
    if (!seen[i] && raw[i] < 0.5) { seen[i] = 1; stack.push(i); }
  };
  for (let x = 0; x < w; x++) { push(x, 0); push(x, h - 1); }
  for (let y = 0; y < h; y++) { push(0, y); push(w - 1, y); }
  while (stack.length) {
    const i = stack.pop();
    const x = i % w, y = (i / w) | 0;
    if (x > 0) push(x - 1, y);
    if (x < w - 1) push(x + 1, y);
    if (y > 0) push(x, y - 1);
    if (y < h - 1) push(x, y + 1);
  }
  const ctr = new Float32Array(w * h);
  let any = false;
  for (let i = 0, n = w * h; i < n; i++) {
    if (!seen[i] && raw[i] < 0.5) { ctr[i] = 1 - raw[i]; any = true; }
  }
  return any ? ctr : null;
}

const fieldCache = new Map();

function glyphField(ch, S) {
  const key = ch + '|' + S;
  const hit = fieldCache.get(key);
  if (hit) return hit;

  const pad = Math.round(S * 0.42);
  const font = `${TUNE.weight} ${S}px ${FONT_FAT}`;
  measure.font = font;
  const adv = Math.max(S * 0.18, measure.measureText(ch).width);
  const w = Math.ceil(adv) + pad * 2;
  const h = Math.ceil(S * 0.80) + pad * 2;

  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.font = font;
  g.textAlign = 'left';
  g.textBaseline = 'alphabetic';
  g.fillStyle = '#fff';
  g.strokeStyle = '#fff';
  g.lineJoin = 'round';
  g.lineCap = 'round';
  g.lineWidth = S * TUNE.bolden * 2;   // stroke straddles the outline
  g.strokeText(ch, pad, h - pad);
  g.fillText(ch, pad, h - pad);

  const px = g.getImageData(0, 0, w, h).data;
  const raw = new Float32Array(w * h);
  for (let i = 0, n = w * h; i < n; i++) raw[i] = px[i * 4 + 3] / 255;

  const rBlur = Math.max(2, Math.round(S * TUNE.blurR));
  const f = blurField(raw, w, h, rBlur);
  const ctr = protectedGaps(raw, w, h, rBlur);
  if (ctr) {
    const cf = blurField(ctr, w, h, Math.max(1, Math.round(S * TUNE.counterR)));
    for (let i = 0, n = w * h; i < n; i++) {
      const keep = 1 - cf[i];
      if (keep < f[i]) f[i] = keep;
    }
  }

  const out = { f, w, h, S };
  fieldCache.set(key, out);
  return out;
}

/* Find a point inside the colour fill nearest a target — keeps gloss marks on the letter. */
function findInside(alpha, w, h, tx, ty, need) {
  const ok = (x, y) => {
    if (x < need || y < need || x >= w - need || y >= h - need) return false;
    return alpha[y * w + x] > 0.92 &&
           alpha[(y - need) * w + x] > 0.72 && alpha[(y + need) * w + x] > 0.72 &&
           alpha[y * w + x - need] > 0.72 && alpha[y * w + x + need] > 0.72;
  };
  tx = Math.round(tx); ty = Math.round(ty);
  if (ok(tx, ty)) return { x: tx, y: ty };
  const step = Math.max(2, Math.round(need * 0.5));
  for (let r = step; r < Math.max(w, h); r += step) {
    for (let a = 0; a < 16; a++) {
      const th = a / 16 * TAU;
      const x = Math.round(tx + Math.cos(th) * r), y = Math.round(ty + Math.sin(th) * r);
      if (ok(x, y)) return { x, y };
    }
  }
  return null;
}

const spriteCache = new Map();

function bubbleSprite(ch, color, S) {
  const key = ch + '|' + color + '|' + S;
  const hit = spriteCache.get(key);
  if (hit) return hit;

  const fld = glyphField(ch, S);
  const { f, w, h } = fld;
  const seed = hash(ch + color) * 40;

  // Threshold wobble: two out-of-phase low-frequency waves, no per-pixel trig.
  const wx = new Float32Array(w), wy = new Float32Array(h);
  for (let x = 0; x < w; x++) wx[x] = Math.sin(x * 0.052 + seed) * 0.62 + Math.sin(x * 0.019 + seed * 2.3) * 0.38;
  for (let y = 0; y < h; y++) wy[y] = Math.sin(y * 0.044 + seed * 1.7) * 0.62 + Math.sin(y * 0.016 + seed * 0.7) * 0.38;

  const cr = parseInt(color.slice(1, 3), 16), cg = parseInt(color.slice(3, 5), 16), cb = parseInt(color.slice(5, 7), 16);
  const lum = (cr * 0.299 + cg * 0.587 + cb * 0.114) / 255;
  const HI = lum > 0.86 ? 0.22 : 0.46;     // white letters need a gentler sheen
  const LO = lum > 0.86 ? 0.10 : 0.20;

  const bodyImg = new ImageData(w, h);
  const innerImg = new ImageData(w, h);
  const shadeImg = new ImageData(w, h);
  const bd = bodyImg.data, idt = innerImg.data, sd = shadeImg.data;
  const innerA = new Float32Array(w * h);

  const d = Math.max(1, Math.round(S * 0.022));
  const AA = 0.055;
  let x0 = w, y0 = h, x1 = 0, y1 = 0;

  for (let y = 0; y < h; y++) {
    const rowW = wy[y];
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      const v = f[i];
      if (v < 0.14) continue;

      const wob = (wx[x] + rowW) * 0.5 * TUNE.wobble;
      const aHalo = smooth(TUNE.tHalo + wob - AA, TUNE.tHalo + wob + AA, v);
      if (aHalo < 0.004) continue;
      const aOut = smooth(TUNE.tOut + wob - AA, TUNE.tOut + wob + AA, v);
      const aIn = smooth(TUNE.tIn + wob - AA, TUNE.tIn + wob + AA, v);

      // soft contact shadow, straight off the blurred field
      sd[i * 4] = 0; sd[i * 4 + 1] = 0; sd[i * 4 + 2] = 0;
      sd[i * 4 + 3] = smooth(0.15, 0.46, v) * 30;

      let r = cr, g = cg, b = cb;
      if (aIn > 0.01) {
        // rim lighting from the field gradient → inflated volume, flat core
        const xi = clamp(x, d, w - d - 1), yi = clamp(y, d, h - d - 1), j = yi * w + xi;
        const gx = f[j + d] - f[j - d];
        const gy = f[j + d * w] - f[j - d * w];
        const gl = Math.sqrt(gx * gx + gy * gy);
        if (gl > 1e-4) {
          const sh = (-gx / gl) * -0.56 + (-gy / gl) * -0.83;   // light from upper-left
          const amt = Math.min(1, gl * TUNE.rim);
          if (sh > 0) { const k = sh * amt * HI; r += (255 - r) * k; g += (255 - g) * k; b += (255 - b) * k; }
          else { const k = -sh * amt * LO; r *= (1 - k); g *= (1 - k * 0.94); b *= (1 - k * 0.86); }
        }
      }

      // white rim → ink contour → flat colour
      const o = i * 4;
      bd[o]     = lerp(lerp(255, 20, aOut), r, aIn);
      bd[o + 1] = lerp(lerp(255, 20, aOut), g, aIn);
      bd[o + 2] = lerp(lerp(255, 22, aOut), b, aIn);
      bd[o + 3] = aHalo * 255;
      idt[o + 3] = aIn * 255;
      innerA[i] = aIn;

      if (aOut > 0.5) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
  }
  if (x1 <= x0 || y1 <= y0) { x0 = 0; y0 = 0; x1 = w - 1; y1 = h - 1; }

  const bw = x1 - x0, bh = y1 - y0;
  const ext = Math.ceil(S * 0.08);
  const sprite = document.createElement('canvas');
  sprite.width = w + ext * 2; sprite.height = h + ext * 2;
  const sc = sprite.getContext('2d');

  const tmp = document.createElement('canvas'); tmp.width = w; tmp.height = h;
  const tc = tmp.getContext('2d');

  // 1 · shadow, offset down-left like the reference
  tc.putImageData(shadeImg, 0, 0);
  sc.drawImage(tmp, ext - S * 0.018, ext + S * 0.040);

  // 2 · body
  tc.clearRect(0, 0, w, h);
  tc.putImageData(bodyImg, 0, 0);
  sc.drawImage(tmp, ext, ext);

  // 3 · gloss + ink ticks, clipped to the colour fill
  const gl = document.createElement('canvas'); gl.width = w; gl.height = h;
  const gc = gl.getContext('2d');
  const dark = lum > 0.86 ? 'rgba(20,20,22,.85)' : 'rgba(20,20,22,.9)';
  const marks = [];
  const p1 = findInside(innerA, w, h, x0 + bw * 0.30, y0 + bh * 0.24, Math.round(S * 0.062));
  if (p1) marks.push({ x: p1.x, y: p1.y, rx: S * 0.055, ry: S * 0.034, a: -0.5 - hash(ch) * 0.5 });
  if (hash(ch + color + 'g') > 0.62) {
    const p2 = findInside(innerA, w, h, x0 + bw * 0.64, y0 + bh * 0.70, Math.round(S * 0.040));
    if (p2) marks.push({ x: p2.x, y: p2.y, rx: S * 0.030, ry: S * 0.020, a: -0.9 });
  }
  for (const m of marks) {
    gc.save(); gc.translate(m.x, m.y); gc.rotate(m.a);
    gc.beginPath(); gc.ellipse(0, 0, m.rx, m.ry, 0, 0, TAU);
    gc.fillStyle = lum > 0.86 ? 'rgba(255,255,255,.92)' : '#fff'; gc.fill();
    gc.lineWidth = Math.max(1, S * 0.012); gc.strokeStyle = dark; gc.stroke();
    gc.restore();
  }
  const pt = findInside(innerA, w, h, x0 + bw * 0.78, y0 + bh * 0.82, Math.round(S * 0.05));
  if (pt && hash(ch + color + 't') > 0.5) {
    gc.save(); gc.translate(pt.x, pt.y); gc.rotate(0.6 + hash(ch) * 0.8);
    gc.beginPath(); gc.moveTo(-S * 0.06, 0); gc.quadraticCurveTo(0, S * 0.03, S * 0.06, 0);
    gc.lineWidth = Math.max(1.2, S * 0.014); gc.strokeStyle = dark; gc.lineCap = 'round'; gc.stroke();
    gc.restore();
  }
  const mask = document.createElement('canvas'); mask.width = w; mask.height = h;
  mask.getContext('2d').putImageData(innerImg, 0, 0);
  gc.globalCompositeOperation = 'destination-in';
  gc.drawImage(mask, 0, 0);
  sc.drawImage(gl, ext, ext);

  const out = {
    canvas: sprite,
    nw: sprite.width / DPR, nh: sprite.height / DPR,
    ncx: (x0 + bw / 2 + ext) / DPR, ncy: (y0 + bh / 2 + ext) / DPR,
    nfs: S / DPR,
    // per unit font size, so a sprite can be reused at any draw scale
    radius: 0.46 * Math.sqrt(bw * bh) / S,
    hw: bw / 2 / S, hh: bh / 2 / S,
  };
  spriteCache.set(key, out);
  return out;
}

/* Black base glyphs get flat sprites so the frame loop is pure drawImage. */
const blackCache = new Map();
function blackSprite(ch, fs) {
  const key = ch + '|' + Math.round(fs) + '|' + PAL.ink;
  const hit = blackCache.get(key);
  if (hit) return hit;
  measure.font = `700 ${fs}px ${FONT}`;
  const adv = Math.max(fs * 0.16, measure.measureText(ch).width);
  const pad = fs * 0.22;
  const w = adv + pad * 2, h = fs * 1.20;
  const baseline = h - fs * 0.30;
  const c = document.createElement('canvas');
  c.width = Math.ceil(w * DPR); c.height = Math.ceil(h * DPR);
  const g = c.getContext('2d');
  g.scale(DPR, DPR);
  g.font = `700 ${fs}px ${FONT}`;
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.fillStyle = PAL.ink;
  g.fillText(ch, pad, baseline);
  const out = { canvas: c, w, h, ox: pad, oy: baseline, adv };
  blackCache.set(key, out);
  return out;
}

/* ══════════════════════════════════════════════════════════════════════════
   4 · ACCENTS — cartoon gloves, a daisy, bean-eyes. Union outline trick:
   stroke the whole silhouette in ink first, then refill it white seam-free.
   ══════════════════════════════════════════════════════════════════════════ */

function capsule(g, x1, y1, x2, y2, r) {
  g.moveTo(x1, y1);
  const a = Math.atan2(y2 - y1, x2 - x1);
  g.arc(x1, y1, r, a + Math.PI / 2, a - Math.PI / 2);
  g.arc(x2, y2, r, a - Math.PI / 2, a + Math.PI / 2);
  g.closePath();
}

function mittPath(g, S, flip) {
  const s = flip ? -1 : 1;
  g.beginPath();
  // palm
  g.moveTo(0.27 * S, 0.12 * S);
  g.arc(0, 0.12 * S, 0.27 * S, 0, TAU);
  // four fat fingers fanned off the knuckles
  for (let i = 0; i < 4; i++) {
    const a = (-0.52 + i * 0.35) * s - Math.PI / 2;
    const len = (0.40 + (i === 1 || i === 2 ? 0.05 : 0)) * S;
    capsule(g, Math.cos(a) * 0.08 * S, 0.08 * S + Math.sin(a) * 0.08 * S,
               Math.cos(a) * len, 0.08 * S + Math.sin(a) * len, 0.115 * S);
  }
  // thumb
  capsule(g, -s * 0.14 * S, 0.14 * S, -s * 0.44 * S, -0.04 * S, 0.115 * S);
  // cuff
  capsule(g, -s * 0.19 * S, 0.36 * S, s * 0.19 * S, 0.36 * S, 0.12 * S);
}

function accentSprite(kind, S, seed) {
  const pad = S * 0.30;
  const c = document.createElement('canvas');
  c.width = Math.ceil((S + pad * 2) * DPR); c.height = Math.ceil((S + pad * 2) * DPR);
  const g = c.getContext('2d');
  g.scale(DPR, DPR);
  g.translate(S / 2 + pad, S / 2 + pad);
  const ink = '#151515';
  const lw = S * 0.055;

  const soft = (draw) => {                   // contact shadow
    g.save(); g.translate(-S * 0.02, S * 0.05);
    g.fillStyle = 'rgba(0,0,0,.10)'; draw(g); g.fill(); g.restore();
  };

  if (kind === 'mitt' || kind === 'mitt2') {
    const flip = kind === 'mitt2';
    const rot = (seed - 0.5) * 1.4;
    g.rotate(rot);
    soft(gg => mittPath(gg, S * 0.9, flip));
    mittPath(g, S * 0.9, flip);
    g.lineJoin = 'round'; g.lineWidth = lw * 2; g.strokeStyle = ink; g.stroke();
    g.fillStyle = ink; g.fill();
    mittPath(g, S * 0.9, flip);
    g.fillStyle = '#fff'; g.fill();
    // knuckle creases + cuff seam
    const M = S * 0.9;
    g.strokeStyle = ink; g.lineWidth = lw * 0.75; g.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      const a = (-0.34 + i * 0.35) * (flip ? -1 : 1) - Math.PI / 2;
      g.beginPath();
      g.moveTo(Math.cos(a) * 0.09 * M, 0.08 * M + Math.sin(a) * 0.09 * M);
      g.lineTo(Math.cos(a) * 0.20 * M, 0.08 * M + Math.sin(a) * 0.20 * M);
      g.stroke();
    }
    g.beginPath();
    g.moveTo((flip ? 1 : -1) * 0.16 * M, 0.26 * M);
    g.quadraticCurveTo(0, 0.33 * M, (flip ? -1 : 1) * 0.16 * M, 0.26 * M);
    g.stroke();
  } else if (kind === 'daisy') {
    const petals = 6, R = S * 0.42;
    const path = gg => {
      gg.beginPath();
      for (let i = 0; i < petals; i++) {
        const a = i / petals * TAU + seed;
        gg.moveTo(0, 0);
        gg.ellipse(Math.cos(a) * R * 0.55, Math.sin(a) * R * 0.55, R * 0.46, R * 0.3, a, 0, TAU);
      }
      gg.moveTo(R * 0.3, 0); gg.arc(0, 0, R * 0.3, 0, TAU);
    };
    soft(path);
    path(g); g.lineJoin = 'round'; g.lineWidth = lw * 1.7; g.strokeStyle = ink; g.stroke();
    g.fillStyle = PAL.cols[0]; g.fill();
    g.beginPath(); g.arc(0, 0, R * 0.24, 0, TAU);
    g.fillStyle = '#fff'; g.fill(); g.lineWidth = lw * 0.9; g.strokeStyle = ink; g.stroke();
  } else if (kind === 'bean') {
    const path = gg => { gg.beginPath(); gg.ellipse(0, 0, S * 0.40, S * 0.22, 0.3, 0, TAU); };
    soft(path);
    path(g); g.lineWidth = lw * 1.6; g.strokeStyle = ink; g.stroke();
    g.fillStyle = '#fff'; g.fill();
    g.beginPath(); g.ellipse(S * 0.05, 0, S * 0.11, S * 0.075, 0.3, 0, TAU);
    g.fillStyle = ink; g.fill();
  }

  const size = S + pad * 2;
  return { canvas: c, nw: size, nh: size, ncx: size / 2, ncy: size / 2, nfs: S, radius: 0.40 };
}

/* ══════════════════════════════════════════════════════════════════════════
   5 · LAYOUT
   ══════════════════════════════════════════════════════════════════════════ */

let PAL = PALETTES.kielm;
let phrase = DEFAULT_PHRASE;
const L = { fs: 0, lead: 0, cap: 0, top: 0, cells: [], lines: [], floor: 0, wallL: 0, wallR: 0, cx: 0, spriteS: 200, bubbleFs: 0 };

function splitPhrase(str) {
  const clean = str.toUpperCase().replace(/\s+/g, ' ').trim();
  if (!clean) return ['A', 'NEW'];
  if (clean.includes('/')) return clean.split('/').map(s => s.trim()).filter(Boolean).slice(0, 9);
  const words = clean.split(' ');
  const out = [];
  let line = '';
  for (const wd of words) {
    if (!line) line = wd;
    else if ((line + ' ' + wd).length <= 8) line += ' ' + wd;
    else { out.push(line); line = wd; }
  }
  if (line) out.push(line);
  return out.slice(0, 9);
}

function capHeight(fs) {
  measure.font = `700 ${fs}px ${FONT}`;
  const m = measure.measureText('H');
  return (m.actualBoundingBoxAscent > 0 ? m.actualBoundingBoxAscent : fs * CAP_EM);
}

function layout() {
  const lines = splitPhrase(phrase);
  const n = lines.length;

  // fit by height and by the widest line
  measure.font = `700 100px ${FONT}`;
  let widest = 1;
  for (const ln of lines) {
    let w = 0;
    for (const ch of ln) w += measure.measureText(ch).width + TRACK * 100;
    widest = Math.max(widest, w - TRACK * 100);
  }
  const capRatio = capHeight(100) / 100;
  // leave head/foot room for the pile that collects on the last lines
  const fsH = (H * 0.90) / ((n - 1) * LEAD + capRatio + 0.42);
  const fsW = (W * (W < 600 ? 0.95 : 0.92)) / (widest / 100);
  const fs = Math.max(26, Math.min(fsH, fsW));

  const cap = capHeight(fs);
  const lead = fs * LEAD;
  const blockH = (n - 1) * lead + cap;
  // centre the type + pile group, not just the type
  const top = clamp((H - blockH - fs * 0.42) / 2, H * 0.03, H * 0.5);

  measure.font = `700 ${fs}px ${FONT}`;
  const cells = [];
  const lineMeta = [];
  let maxW = 0;
  for (let li = 0; li < n; li++) {
    const ln = lines[li];
    const advs = [];
    let lw = 0;
    for (const ch of ln) { const a = measure.measureText(ch).width; advs.push(a); lw += a + TRACK * fs; }
    lw -= TRACK * fs;
    maxW = Math.max(maxW, lw);
    let x = (W - lw) / 2;
    const baseline = top + cap + li * lead;
    lineMeta.push({ text: ln, baseline, x0: x, w: lw });
    for (let ci = 0; ci < ln.length; ci++) {
      const ch = ln[ci];
      if (ch !== ' ') {
        cells.push({
          ch, li, x, adv: advs[ci], baseline, idx: cells.length,
          cx: x + advs[ci] / 2, cy: baseline - cap * 0.5,
          out: false, pop: 0,
        });
      }
      x += advs[ci] + TRACK * fs;
    }
  }

  L.fs = fs; L.cap = cap; L.lead = lead; L.top = top; L.cells = cells; L.lines = lineMeta;
  L.cx = W / 2;
  L.bubbleFs = fs * TUNE.bubble;
  L.floor = Math.min(H - fs * 0.12, top + blockH + fs * 0.34);
  L.wallL = Math.max(fs * 0.12, (W - maxW) / 2 - fs * 0.40);
  L.wallR = Math.min(W - fs * 0.12, (W + maxW) / 2 + fs * 0.40);

  // Colour per cell: a fixed walk through the palette that skips any colour
  // already used by the letter to the left or the one above, so the heap never
  // stacks two of the same.
  // Anchors are the opening letters of each line. They never blow out, which is
  // what keeps the phrase readable as FO / BE / AN with the rest in the heap.
  const cols = PAL.cols;
  let prevRow = [];
  for (let li = 0; li < n; li++) {
    const row = cells.filter(c => c.li === li);
    const anchor = Math.min(row.length, Math.max(2, Math.round(row.length * 0.4)));
    const mine = [];
    row.forEach((c, i) => {
      const banned = [mine[i - 1], prevRow[i], prevRow[i - 1]];
      let pick = cols[(li + i * 5) % cols.length];
      for (let k = 1; k < cols.length && banned.indexOf(pick) >= 0; k++) {
        pick = cols[(li + i * 5 + k) % cols.length];
      }
      c.color = pick;
      mine[i] = pick;
      c.anchored = i < anchor;
      c.ci = i;
    });
    prevRow = mine;
  }

  const S = clamp(Math.round(L.bubbleFs * DPR), 90, 400);
  if (S !== L.spriteS) { L.spriteS = S; spriteCache.clear(); fieldCache.clear(); }
  blackCache.clear();
}

/* ══════════════════════════════════════════════════════════════════════════
   6 · WORLD
   ══════════════════════════════════════════════════════════════════════════ */

const bodies = [];
const fx = [];
const waves = [];
let serial = 0;
let seeding = false;
let restoring = false;
let lastInput = 0;
const touch = () => { lastInput = performance.now() / 1000; };

function spriteFor(b) {
  return b.kind === 'letter' ? bubbleSprite(b.ch, b.color, L.spriteS) : b.sprite;
}

function eject(cell, cxp, cyp, power, slot) {
  if (cell.out) return null;
  cell.out = true;
  const sp = bubbleSprite(cell.ch, cell.color, L.spriteS);
  const dx = cell.cx - cxp, dy = cell.cy - cyp;
  const d = Math.max(1, Math.hypot(dx, dy));
  const k = L.fs * power * rnd(0.85, 1.25);
  const b = {
    kind: 'letter', ch: cell.ch, color: cell.color, cell,
    x: cell.cx, y: cell.cy,
    vx: dx / d * k + rnd(-0.35, 0.35) * L.fs,
    vy: dy / d * k * 0.7 - L.fs * rnd(1.9, 3.1),
    ang: rnd(-0.16, 0.16), spin: rnd(-2.6, 2.6),
    fsize: L.bubbleFs, r: sp.radius * L.bubbleFs,
    hw: sp.hw * L.bubbleFs, hh: sp.hh * L.bubbleFs,
    sq: 0, sqAng: 0, alpha: 1, scale: 1,
    state: 'live', rest: 0, born: performance.now() / 1000, id: ++serial,
  };
  if (slot) b.slot = slot;
  bodies.push(b);
  spawnTicks(cell.cx, cell.cy, 3, 0.5);
  Sound.pop();
  cullBubbles();
  return b;
}

const ACCENT_SCALE = { mitt: 0.88, mitt2: 0.88, daisy: 0.40, bean: 0.42 };

function addAccent(kind, x, y, seed) {
  const b = {
    kind, seed, x, y, vx: rnd(-0.4, 0.4) * L.fs, vy: -L.fs * rnd(0.4, 1.2),
    ang: rnd(-0.5, 0.5), spin: rnd(-2, 2),
    fsize: L.bubbleFs * (ACCENT_SCALE[kind] || 0.6), sq: 0, sqAng: 0, alpha: 1, scale: 1,
    state: 'live', rest: 0, born: performance.now() / 1000, id: ++serial,
  };
  b.sprite = accentSprite(kind, b.fsize, seed);
  b.r = b.sprite.radius * b.fsize;
  b.hw = b.r; b.hh = b.r;
  bodies.push(b);
  return b;
}

/* Blasts fling extra gloves in; without a cap they pile up over a long session
   and bury the letters. Ones thrown during play retire before the seeded set. */
function capAccents() {
  const acc = bodies.filter(b => b.kind !== 'letter');
  if (acc.length <= 5) return;
  acc.sort((a, b) => (a.seeded ? 1 : 0) - (b.seeded ? 1 : 0) || a.id - b.id);
  for (let i = 0; i < acc.length - 5; i++) {
    acc[i].dead = true;
    const k = bodies.indexOf(acc[i]);
    if (k >= 0) bodies.splice(k, 1);
  }
}

/* Gloves and trinkets ride along with the nearest letter instead of colliding
   with it — the reference nests them into the heap, and a solver would only
   shove everything apart. They cut loose when their host deflates home. */
function attachToNearest(acc) {
  let host = null, best = Infinity;
  for (const b of bodies) {
    if (b.kind !== 'letter' || b.state !== 'live') continue;
    const d = Math.hypot(b.x - acc.x, b.y - acc.y);
    if (d < best) { best = d; host = b; }
  }
  if (!host) return acc;
  const c = Math.cos(-host.ang), s = Math.sin(-host.ang);
  const dx = acc.x - host.x, dy = acc.y - host.y;
  acc.host = host;
  acc.ox = dx * c - dy * s;
  acc.oy = dx * s + dy * c;
  acc.oang = acc.ang - host.ang;
  return acc;
}

function followHosts() {
  for (const b of bodies) {
    if (!b.host) continue;
    if (b.host.dead || b.host.state !== 'live') {
      b.host = null;
      b.vy = 0; b.vx = 0;
      continue;
    }
    const c = Math.cos(b.host.ang), s = Math.sin(b.host.ang);
    b.x = b.host.x + b.ox * c - b.oy * s;
    b.y = b.host.y + b.ox * s + b.oy * c;
    b.ang = b.host.ang + b.oang;
  }
}

function cullBubbles() {
  const live = bodies.filter(b => b.kind === 'letter' && b.state === 'live');
  if (live.length <= MAX_OUT) return;
  // letters knocked out during play go back first; the composed opening heap stays
  live.sort((a, b) => (a.slot ? 1 : 0) - (b.slot ? 1 : 0) || a.id - b.id);
  for (let i = 0; i < live.length - MAX_OUT; i++) sendHome(live[i]);
}

function sendHome(b) {
  if (b.state !== 'live' || !b.cell) return;
  b.state = 'home';
  b.asleep = false;
  b.t = 0;
  b.fromX = b.x; b.fromY = b.y; b.fromAng = b.ang;
}

/* ── physics ───────────────────────────────────────────────────────────── */

function integrate(dt) {
  const g = L.fs * 12;
  const R = L.fs * 1.15;
  const nowS = performance.now() / 1000;
  const pushing = seeding ? 0 : (pointer.on && !pointer.ghost ? 1 : (pointer.ghost ? 0.26 : 0));

  for (const b of bodies) {
    if (b.state !== 'live' || b.host) continue;
    b.support = false;

    // The opening heap is a composition, not a simulation: it holds its shape
    // until something actually disturbs it, then physics takes over.
    if (b.asleep) {
      if (pushing && Math.hypot(b.x - pointer.x, b.y - pointer.y) < R * 1.1) b.asleep = false;
      else continue;
    }

    if (b.slot && restoring) {
      // left alone, the heap walks itself back into the opening composition
      const k = Math.pow(0.055, dt);
      b.vx = (b.vx + (b.slot.x - b.x) * 15 * dt) * k;
      b.vy = (b.vy + (b.slot.y - b.y) * 15 * dt) * k;
      b.ang += (b.slot.ang - b.ang) * (1 - Math.pow(0.12, dt));
      b.spin *= Math.pow(0.02, dt);
    } else {
      b.vy += g * dt;
    }

    if (pushing) {
      const dx = b.x - pointer.x, dy = b.y - pointer.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < R * R) {
        const d = Math.max(6, Math.sqrt(d2));
        const f = (1 - d / R) * L.fs * 34 * pushing;
        b.vx += dx / d * f * dt;
        b.vy += dy / d * f * dt;
        b.spin += (dx / d) * 1.6 * dt * 60 * 0.02;
      }
    }

    b.vx *= 0.995; b.vy *= 0.995;
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.ang += b.spin * dt;
    b.spin *= 0.985;
    b.sq *= 0.86;
  }

  for (let it = 0; it < 3; it++) {
    for (let i = 0; i < bodies.length; i++) {
      const a = bodies[i];
      if (a.state !== 'live' || a.host) continue;
      for (let j = i + 1; j < bodies.length; j++) {
        const c = bodies[j];
        if (c.state !== 'live' || c.host) continue;
        if (a.asleep && c.asleep) continue;
        let dx = c.x - a.x, dy = c.y - a.y;
        let d2 = dx * dx + dy * dy;
        const rr = (a.r + c.r) * PACK;   // matches how the heap is composed, so a
        if (d2 >= rr * rr || d2 < 1e-6) continue;   // settled heap needs no resolve
        const d = Math.sqrt(d2);
        const nx = dx / d, ny = dy / d;
        const pen = rr - d;
        // a sleeping body acts as scenery until something hits it hard enough
        const ma = a.asleep ? 1e6 : a.r * a.r, mc = c.asleep ? 1e6 : c.r * c.r;
        const tot = ma + mc;
        const corr = pen * 0.5;
        a.x -= nx * corr * (mc / tot); a.y -= ny * corr * (mc / tot);
        c.x += nx * corr * (ma / tot); c.y += ny * corr * (ma / tot);
        if (ny > 0.45) a.support = true; else if (ny < -0.45) c.support = true;
        const rvx = c.vx - a.vx, rvy = c.vy - a.vy;
        const vn = rvx * nx + rvy * ny;
        if (vn < -L.fs * 1.2) { a.asleep = false; c.asleep = false; }
        if (vn < 0) {
          const jm = -(1 + 0.22) * vn / (1 / ma + 1 / mc);
          a.vx -= jm * nx / ma; a.vy -= jm * ny / ma;
          c.vx += jm * nx / mc; c.vy += jm * ny / mc;
          const tvx = rvx - vn * nx, tvy = rvy - vn * ny;
          const tv = Math.hypot(tvx, tvy);
          if (tv > 1) {
            const fr = Math.min(1, Math.abs(jm) * 0.4 / (tv * Math.min(ma, mc)));
            a.spin += (tvx * ny - tvy * nx) / a.r * 0.0016 * fr * 60;
            c.spin -= (tvx * ny - tvy * nx) / c.r * 0.0016 * fr * 60;
          }
          if (it === 0) {
            const imp = Math.abs(vn) / (L.fs * 9);
            if (imp > 0.12) {
              const s = Math.min(0.22, imp * 0.2);
              a.sq = Math.max(a.sq, s); a.sqAng = Math.atan2(ny, nx);
              c.sq = Math.max(c.sq, s); c.sqAng = Math.atan2(ny, nx);
              if (imp > 0.5 && it === 0) Sound.thud(Math.min(1, imp * 0.5));
            }
          }
        }
      }
    }

    // bounds
    for (const b of bodies) {
      if (b.state !== 'live' || b.host || b.asleep) continue;
      if (b.y + b.r > L.floor) {
        const pen = b.y + b.r - L.floor;
        b.y = L.floor - b.r;
        if (b.vy > 0) {
          if (it === 0 && b.vy > L.fs * 2.2) { b.sq = Math.max(b.sq, Math.min(0.24, b.vy / (L.fs * 26))); b.sqAng = Math.PI / 2; Sound.thud(0.5); }
          b.vy *= -0.20;
        }
        b.vx *= 0.90;
        b.spin = b.spin * 0.88 - (b.vx / Math.max(1, b.r)) * 0.10;
        if (pen > 0.5) b.vx += (Math.random() - 0.5) * 2;
      }
      const side = Math.max(b.r, b.hw || b.r);   // keep the whole sprite on screen
      if (b.x - side < L.wallL) { b.x = L.wallL + side; if (b.vx < 0) b.vx *= -0.34; b.spin *= 0.9; }
      if (b.x + side > L.wallR) { b.x = L.wallR - side; if (b.vx > 0) b.vx *= -0.34; b.spin *= 0.9; }
      if (b.y - b.r < -H * 0.4) { b.y = -H * 0.4 + b.r; b.vy = Math.max(0, b.vy); }
    }
  }

  // settle, and retire strays that nobody is playing with any more
  for (const b of bodies) {
    if (b.state !== 'live' || b.host || b.asleep) continue;
    const slow = Math.hypot(b.vx, b.vy) < L.fs * 0.6;
    const seated = b.y + b.r > L.floor - 2 || b.support;
    b.rest = slow ? b.rest + dt : 0;
    if (slow && (seated || (b.slot && restoring))) {
      const k = Math.pow(0.02, dt);
      b.vx *= k; b.vy *= k; b.spin *= Math.pow(0.004, dt);
      if (!b.slot && Math.abs(b.ang) > 0.001) b.ang *= Math.pow(0.35, dt);
      if (b.slot && restoring && Math.hypot(b.slot.x - b.x, b.slot.y - b.y) < L.fs * 0.05) {
        b.x = b.slot.x; b.y = b.slot.y; b.ang = b.slot.ang;
        b.vx = 0; b.vy = 0; b.spin = 0; b.asleep = true;
      }
    }
    // strays deflate home once they settle, and unconditionally once the page has
    // been quiet for a while — the phrase always comes back
    if (!b.slot && b.kind === 'letter' && (b.rest > 2.4 || (restoring && nowS - b.born > 6))) sendHome(b);
  }

  // returning letters
  for (let i = bodies.length - 1; i >= 0; i--) {
    const b = bodies[i];
    if (b.state !== 'home') continue;
    b.t = Math.min(1, b.t + dt * 1.9);
    const t = easeOut(b.t);
    b.x = lerp(b.fromX, b.cell.cx, t);
    b.y = lerp(b.fromY, b.cell.cy, t) - Math.sin(t * Math.PI) * L.fs * 0.35;
    b.ang = lerp(b.fromAng, 0, t);
    b.scale = lerp(1, L.cap / (L.bubbleFs * 0.72), t);
    b.alpha = b.t > 0.72 ? 1 - (b.t - 0.72) / 0.28 : 1;
    if (b.t >= 1) {
      b.cell.out = false; b.cell.pop = 1;
      b.dead = true;
      bodies.splice(i, 1);
      spawnTicks(b.cell.cx, b.cell.cy, 2, 0.35);
    }
  }

  // accents that fall out of the world
  for (let i = bodies.length - 1; i >= 0; i--) {
    const b = bodies[i];
    if (b.kind !== 'letter' && b.y > H + L.fs * 2) { b.dead = true; bodies.splice(i, 1); }
  }

  followHosts();
}

/* ══════════════════════════════════════════════════════════════════════════
   7 · EFFECTS
   ══════════════════════════════════════════════════════════════════════════ */

function spawnTicks(x, y, n, scale) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU);
    fx.push({ type: 'tick', x, y, a, r0: L.fs * 0.18 * scale, len: L.fs * rnd(0.20, 0.40) * scale, t: 0, life: rnd(0.20, 0.34) });
  }
}

function spawnDots(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = rnd(-Math.PI * 0.9, Math.PI * 0.1);
    const sp = L.fs * rnd(1.6, 4.2);
    fx.push({ type: 'dot', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: L.fs * rnd(0.035, 0.075), t: 0, life: rnd(0.7, 1.2), ang: rnd(0, TAU) });
  }
}

/* A ring of overlapping lobes, stroked heavy then filled white so only the union
   outline survives — the explosion centre from the source video. */
function cloudSprite(r, seed) {
  const pad = r * 0.28;
  const c = document.createElement('canvas');
  c.width = Math.ceil((r * 2 + pad * 2) * DPR);
  c.height = Math.ceil((r * 1.9 + pad * 2) * DPR);
  const g = c.getContext('2d');
  g.scale(DPR, DPR);
  g.translate(r + pad, r * 0.95 + pad);
  g.rotate(seed * 0.3);
  g.beginPath();
  const lobes = 9;
  for (let i = 0; i < lobes; i++) {
    const a = i / lobes * TAU;
    const rr = r * (0.62 + 0.16 * Math.sin(i * 2.3 + seed));
    const lr = r * (0.40 + 0.10 * Math.sin(i * 1.7 + seed * 2));
    const x = Math.cos(a) * rr, y = Math.sin(a) * rr * 0.88;
    g.moveTo(x + lr, y);
    g.arc(x, y, lr, 0, TAU);
  }
  g.lineWidth = Math.max(2.5, L.fs * 0.055);
  g.strokeStyle = PAL.ink; g.lineJoin = 'round'; g.stroke();
  g.fillStyle = '#fff'; g.fill();
  return c;
}

function blast(x, y, strength) {
  waves.push({ x, y, t: 0, life: 0.55, r: L.fs * 3.2 * strength });
  const r = L.fs * 0.82 * strength;
  fx.push({ type: 'burst', x, y, t: 0, life: 0.42, r, sprite: cloudSprite(r, Math.random() * 10) });
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * TAU + rnd(-0.1, 0.1);
    fx.push({ type: 'tick', x, y, a, r0: L.fs * 0.55 * strength, len: L.fs * rnd(0.4, 1.0) * strength, t: 0, life: rnd(0.26, 0.42) });
  }
  spawnDots(x, y, 7);

  const R = L.fs * 2.4 * strength;
  for (const b of bodies) {
    if (b.state !== 'live') continue;
    const dx = b.x - x, dy = b.y - y;
    const d = Math.max(8, Math.hypot(dx, dy));
    if (d > R) continue;
    b.asleep = false;
    const f = (1 - d / R) * L.fs * 22 * strength;
    b.vx += dx / d * f; b.vy += dy / d * f - L.fs * 1.2;
    b.spin += (Math.random() - 0.5) * 9;
    b.sq = Math.max(b.sq, 0.18); b.sqAng = Math.atan2(dy, dx);
  }

  // knock out everything the blast touches, nearest first
  const near = L.cells.filter(c => !c.out && !c.anchored && Math.hypot(c.cx - x, c.cy - y) < L.fs * 1.05 * strength);
  near.sort((a, b2) => Math.hypot(a.cx - x, a.cy - y) - Math.hypot(b2.cx - x, b2.cy - y));
  near.slice(0, 4).forEach(c => eject(c, x, y, 5.5 * strength));
  if (Math.random() < 0.4) {
    addAccent(Math.random() < 0.5 ? 'mitt' : 'mitt2', x + rnd(-40, 40), y, Math.random());
    capAccents();
  }
  Sound.boom();
}

function stepFx(dt) {
  for (let i = waves.length - 1; i >= 0; i--) {
    waves[i].t += dt;
    if (waves[i].t >= waves[i].life) waves.splice(i, 1);
  }
  for (let i = fx.length - 1; i >= 0; i--) {
    const e = fx[i];
    e.t += dt;
    if (e.type === 'dot') { e.vy += L.fs * 7 * dt; e.x += e.vx * dt; e.y += e.vy * dt; e.ang += dt * 3; }
    if (e.t >= e.life) fx.splice(i, 1);
  }
}

function drawFx() {
  ctx.lineCap = 'round';
  for (const e of fx) {
    const p = e.t / e.life;
    if (e.type === 'tick') {
      const g = easeOut(p);
      ctx.globalAlpha = 1 - p * p;
      ctx.strokeStyle = PAL.ink;
      ctx.lineWidth = Math.max(1, L.fs * 0.022 * (1 - p * 0.6));
      const r0 = e.r0 + g * e.len * 0.55, r1 = r0 + e.len * (1 - p * 0.5);
      ctx.beginPath();
      ctx.moveTo(e.x + Math.cos(e.a) * r0, e.y + Math.sin(e.a) * r0);
      ctx.lineTo(e.x + Math.cos(e.a) * r1, e.y + Math.sin(e.a) * r1);
      ctx.stroke();
    } else if (e.type === 'dot') {
      ctx.globalAlpha = 1 - p * p;
      ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.ang);
      ctx.beginPath(); ctx.ellipse(0, 0, e.r, e.r * 0.72, 0, 0, TAU);
      ctx.fillStyle = '#fff'; ctx.fill();
      ctx.lineWidth = Math.max(1, L.fs * 0.016); ctx.strokeStyle = PAL.ink; ctx.stroke();
      ctx.restore();
    } else if (e.type === 'burst') {
      // Comic blast cloud, pre-rendered so fading it out fades the whole shape.
      // Drawn live it would go translucent and show its own construction circles.
      const g = 0.45 + easeOut(p) * 0.70;
      const w2 = e.sprite.width / DPR, h2 = e.sprite.height / DPR;
      ctx.globalAlpha = p < 0.72 ? 1 : 1 - (p - 0.72) / 0.28;
      ctx.drawImage(e.sprite, e.x - w2 * g / 2, e.y - h2 * g / 2, w2 * g, h2 * g);
    }
  }
  ctx.globalAlpha = 1;
}

/* ══════════════════════════════════════════════════════════════════════════
   8 · RENDER
   ══════════════════════════════════════════════════════════════════════════ */

function drawType(dt) {
  const R = L.fs * 1.5;
  const live = pointer.on || pointer.ghost;
  for (const c of L.cells) {
    if (c.pop > 0) c.pop = Math.max(0, c.pop - dt * 3.2);
    if (c.out) continue;

    let dx = 0, dy = 0, sc = 1;
    if (live) {
      const ox = c.cx - pointer.x, oy = c.cy - pointer.y;
      const d = Math.hypot(ox, oy);
      if (d < R && d > 0.001) {
        const f = (1 - d / R);
        const push = f * f * L.fs * 0.10;
        dx = ox / d * push; dy = oy / d * push;
        sc = 1 + f * f * 0.035;
      }
    }
    // a blast sends a ring through the standing type
    for (const w of waves) {
      const ox = c.cx - w.x, oy = c.cy - w.y;
      const d = Math.hypot(ox, oy);
      if (d < 0.001) continue;
      const p = w.t / w.life;
      const front = w.r * easeOut(p);
      const band = (d - front) / (L.fs * 0.55);
      const amp = (1 - p) * L.fs * 0.16 * Math.exp(-band * band);
      dx += ox / d * amp; dy += oy / d * amp;
      sc += amp / L.fs * 0.20;
    }
    if (c.pop > 0) { const p = c.pop; sc *= 1 + 0.16 * p * p; }

    const sp = blackSprite(c.ch, L.fs);
    if (dx || dy || sc !== 1) {
      ctx.save();
      ctx.translate(c.cx + dx, c.cy + dy);
      ctx.scale(sc, sc);
      ctx.drawImage(sp.canvas, -(c.cx - c.x) - sp.ox, -(c.cy - c.baseline) - sp.oy, sp.w, sp.h);
      ctx.restore();
    } else {
      ctx.drawImage(sp.canvas, c.x - sp.ox, c.baseline - sp.oy, sp.w, sp.h);
    }
  }
}

const drawOrder = [];
function drawBodies() {
  drawOrder.length = 0;
  for (const b of bodies) drawOrder.push(b);
  drawOrder.sort((a, b) => (a.z || 0) - (b.z || 0) || a.id - b.id);
  for (const b of drawOrder) {
    const sp = spriteFor(b);
    const k = (b.fsize / sp.nfs) * b.scale;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.ang);
    if (b.sq > 0.004) { ctx.rotate(b.sqAng); ctx.scale(1 + b.sq, 1 - b.sq); ctx.rotate(-b.sqAng); }
    if (b.alpha < 1) ctx.globalAlpha = b.alpha;
    ctx.drawImage(sp.canvas, -sp.ncx * k, -sp.ncy * k, sp.nw * k, sp.nh * k);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* The explosion centre draws itself: a reticle instead of the system cursor, plus
   drag streaks behind a fast pointer. Also the only pointer feedback on touch. */
function drawCursorEnergy(dt) {
  pointer.aim += ((pointer.on && !pointer.ghost ? 1 : 0) - pointer.aim) * Math.min(1, dt * 9);
  pointer.press = Math.max(0, pointer.press - dt * 3.4);
  if (pointer.aim < 0.02) return;

  ctx.save();
  ctx.strokeStyle = PAL.ink;
  ctx.lineCap = 'round';

  const sp = Math.min(1, pointer.speed / (L.fs * 14));
  if (sp > 0.05) {
    ctx.globalAlpha = pointer.aim * sp * 0.45;
    ctx.lineWidth = Math.max(1, L.fs * 0.016);
    const a = Math.atan2(-pointer.vy, -pointer.vx);
    for (let i = 0; i < 3; i++) {
      const off = (i - 1) * 0.42;
      const r0 = L.fs * (0.20 + i * 0.05), r1 = r0 + L.fs * 0.24 * sp;
      ctx.beginPath();
      ctx.moveTo(pointer.x + Math.cos(a + off) * r0, pointer.y + Math.sin(a + off) * r0);
      ctx.lineTo(pointer.x + Math.cos(a + off) * r1, pointer.y + Math.sin(a + off) * r1);
      ctx.stroke();
    }
  }

  const r = L.fs * (0.085 + 0.055 * pointer.press);
  const lw = Math.max(1.2, L.fs * 0.011);
  ctx.globalAlpha = pointer.aim * (0.62 + 0.38 * pointer.press);
  ctx.lineWidth = lw;
  ctx.beginPath();
  ctx.arc(pointer.x, pointer.y, r, 0, TAU);
  ctx.stroke();
  for (let i = 0; i < 4; i++) {
    const th = i * Math.PI / 2 + Math.PI / 4;
    const r0 = r * 1.5, r1 = r * (2.15 + pointer.press * 0.8);
    ctx.beginPath();
    ctx.moveTo(pointer.x + Math.cos(th) * r0, pointer.y + Math.sin(th) * r0);
    ctx.lineTo(pointer.x + Math.cos(th) * r1, pointer.y + Math.sin(th) * r1);
    ctx.stroke();
  }
  ctx.globalAlpha = pointer.aim;
  ctx.fillStyle = PAL.ink;
  ctx.beginPath();
  ctx.arc(pointer.x, pointer.y, lw * 1.1, 0, TAU);
  ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ══════════════════════════════════════════════════════════════════════════
   9 · POINTER + LOOP
   ══════════════════════════════════════════════════════════════════════════ */

const pointer = { x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0, speed: 0, on: false, down: false, ghost: false, aim: 0, press: 0, t: rnd(0, 100) };
let lastEject = 0;

function ghostStep(dt, now) {
  if (now < 3) return;            // let the opening composition land first
  pointer.t += dt;
  const t = pointer.t;
  const lines = L.lines;
  if (!lines.length) return;
  const lo = lines[Math.max(0, lines.length - 3)];
  const hi = lines[lines.length - 1];
  const spanY = hi.baseline - lo.baseline + L.cap;
  const x = W / 2 + Math.sin(t * 0.34) * (L.fs * 1.9) + Math.sin(t * 0.83 + 1.3) * (L.fs * 0.5);
  const y = lo.baseline - L.cap * 0.5 + (0.5 + 0.5 * Math.sin(t * 0.47 + 0.6)) * spanY * 0.8;
  pointer.px = pointer.x; pointer.py = pointer.y;
  pointer.x = x; pointer.y = y;
  pointer.vx = (pointer.x - pointer.px) / Math.max(dt, 1e-3);
  pointer.vy = (pointer.y - pointer.py) / Math.max(dt, 1e-3);
  pointer.speed = Math.hypot(pointer.vx, pointer.vy);
}

function knockAtPointer(now) {
  if (now - lastEject < (pointer.ghost ? GHOST_GAP : EJECT_GAP)) return;
  const R = L.fs * (pointer.ghost ? 0.30 : 0.40);
  let best = null, bestD = Infinity;
  for (const c of L.cells) {
    if (c.out || c.anchored) continue;
    if (pointer.ghost && c.li < L.lines.length - 2) continue;
    const d = Math.hypot(c.cx - pointer.x, c.cy - pointer.y);
    if (d < R && d < bestD) { bestD = d; best = c; }
  }
  if (best) {
    lastEject = now;
    eject(best, pointer.x, pointer.y, pointer.ghost ? 1.5 : 2.1 + Math.min(1.8, pointer.speed / (L.fs * 12)));
    if (!pointer.ghost) spawnDots(best.cx, best.cy, 2);
  }
}

let last = 0, acc = 0;
const FIXED = 1 / 120;
let frames = 0, fpsT = 0, fpsVal = 0;

function frame(now) {
  requestAnimationFrame(frame);
  now /= 1000;
  let dt = last ? Math.min(now - last, 1 / 20) : 1 / 60;
  last = now;

  frames++; fpsT += dt;
  if (fpsT > 1) { fpsVal = frames / fpsT; frames = 0; fpsT = 0; }

  const quiet = !seeding && now - lastInput > QUIET;
  if (quiet && !restoring) recompose();
  restoring = quiet;
  if (pointer.ghost) ghostStep(dt, now);
  if (pointer.on || (pointer.ghost && now > 3)) knockAtPointer(now);

  acc = Math.min(acc + dt, 0.1);
  while (acc >= FIXED) { integrate(FIXED); acc -= FIXED; }
  stepFx(dt);

  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);
  drawType(dt);
  drawFx();
  drawBodies();
  drawCursorEnergy(dt);

  pointer.speed *= 0.86;
}

/* ══════════════════════════════════════════════════════════════════════════
   10 · SOUND (stub-by-default, tiny synth when unmuted)
   ══════════════════════════════════════════════════════════════════════════ */

const Sound = {
  on: false, ac: null, last: 0,
  enable() {
    if (!this.ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      this.ac = new AC();
      this.bus = this.ac.createGain();
      this.bus.gain.value = 0.5;
      this.bus.connect(this.ac.destination);
    }
    if (this.ac.state === 'suspended') this.ac.resume();
    this.on = true;
    return true;
  },
  gate() {
    if (!this.on || !this.ac) return false;
    const t = this.ac.currentTime;
    if (t - this.last < 0.035) return false;
    this.last = t; return true;
  },
  pop() {
    if (!this.gate()) return;
    const t = this.ac.currentTime, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(rnd(460, 620), t);
    o.frequency.exponentialRampToValueAtTime(140, t + 0.10);
    g.gain.setValueAtTime(0.18, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 0.13);
    o.connect(g); g.connect(this.bus); o.start(t); o.stop(t + 0.14);
  },
  thud(v) {
    if (!this.gate()) return;
    const t = this.ac.currentTime, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(rnd(90, 150), t);
    o.frequency.exponentialRampToValueAtTime(48, t + 0.09);
    g.gain.setValueAtTime(0.10 * clamp(v, 0.2, 1), t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 0.11);
    o.connect(g); g.connect(this.bus); o.start(t); o.stop(t + 0.12);
  },
  boom() {
    if (!this.on || !this.ac) return;
    const t = this.ac.currentTime;
    const len = Math.floor(this.ac.sampleRate * 0.22);
    const buf = this.ac.createBuffer(1, len, this.ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
    const src = this.ac.createBufferSource(); src.buffer = buf;
    const f = this.ac.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(1800, t); f.frequency.exponentialRampToValueAtTime(220, t + 0.2);
    const g = this.ac.createGain(); g.gain.setValueAtTime(0.28, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 0.22);
    src.connect(f); f.connect(g); g.connect(this.bus); src.start(t);
  },
};

/* ══════════════════════════════════════════════════════════════════════════
   11 · SCENE SETUP
   ══════════════════════════════════════════════════════════════════════════ */

let heapSlots = [];

function clearWorld() {
  bodies.length = 0; fx.length = 0; waves.length = 0;
  heapSlots = [];
  for (const c of L.cells) { c.out = false; c.pop = 0; }
}

/* Called once when the page goes quiet: any heap letter that wandered back into
   the phrase is knocked out again and flown to its slot, and orphaned accents
   find a new host. The poster puts itself back together. */
function recompose() {
  let live = bodies.filter(b => b.kind === 'letter' && b.state === 'live').length;
  for (const s of heapSlots) {
    if (!s.cell || s.cell.out || live >= MAX_OUT) continue;
    const b = eject(s.cell, s.cell.cx, s.cell.cy + L.fs * 0.6, 0.9, { x: s.x, y: s.y, ang: s.ang });
    if (!b) continue;
    b.vx *= 0.35; b.vy = -L.fs * 1.4;
    live++;
  }
  for (const b of bodies) if (b.kind !== 'letter' && !b.host && b.rest > 0.4) attachToNearest(b);
}

/* Opening composition: the tails of the last lines are already blown out and
   piled up, so the very first frame reads as the reference poster. */
function seedScene() {
  clearWorld();
  seeding = true;
  const n = L.lines.length;
  const rows = [];
  for (let k = Math.max(0, n - 3); k < n; k++) {
    const row = L.cells.filter(c => c.li === k && !c.anchored);
    if (row.length) rows.push(row);
  }
  if (!rows.length) { seeding = false; return; }

  // The heap is composed, not dropped: each line's knocked-out tail stays together
  // as a row, dropped where it stood, stacked in reading order. That is why the
  // reference still reads BE / AN in black with FORE / YONE piled to their right.
  // Bodies are packed bottom-up in contact terms — each letter one collision
  // radius from the next — so the heap opens at rest and gravity has nothing to
  // collapse. Reverse reading order puts the last line on the floor.
  const packed = [];
  for (let ri = rows.length - 1; ri >= 0; ri--) {     // last line ends up on the floor
    const made = [];
    for (const c of rows[ri]) {
      const b = eject(c, c.cx, L.floor, 0.3);
      if (b) made.push(b);
    }
    for (let i = 0; i < made.length; i += 4) packed.push(made.slice(i, i + 4));
  }
  if (!packed.length) { seeding = false; return; }

  let y = L.floor, prevR = 0;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  packed.forEach((row, i) => {
    const maxR = row.reduce((m, b) => Math.max(m, b.r), 0);
    y = i === 0 ? L.floor - maxR : y - (maxR + prevR) * PACK;
    prevR = maxR;
    // each row starts where its own letters stood, so the heap leans right as it
    // climbs and the black line openings stay clear
    const span = row.reduce((s, b) => s + b.r * 2 * PACK, 0);
    let x = clamp(row[0].cell.x - L.bubbleFs * 0.12, L.wallL, Math.max(L.wallL, L.wallR - span));
    for (const b of row) {
      b.x = clamp(x + b.r * PACK + rnd(-0.02, 0.02) * L.fs, L.wallL + b.r, L.wallR - b.r);
      b.y = y + rnd(-0.04, 0.04) * L.fs;
      b.vx = 0; b.vy = 0; b.spin = 0;
      b.ang = rnd(-0.22, 0.22);
      b.slot = { x: b.x, y: b.y, ang: b.ang };
      b.asleep = true;
      heapSlots.push({ cell: b.cell, x: b.x, y: b.y, ang: b.ang });
      x += b.r * 2 * PACK;
      x0 = Math.min(x0, b.x - b.r); x1 = Math.max(x1, b.x + b.r);
      y0 = Math.min(y0, b.y - b.r); y1 = Math.max(y1, b.y + b.r);
    }
  });

  // accents tucked into the heap, like the gloves and daisy in the reference
  const hw = x1 - x0, hh = y1 - y0;
  const tuck = (kind, fx2, fy, seed, z) => {
    const a = addAccent(kind, x0 + hw * fx2, y0 + hh * fy, seed);
    a.z = z; a.vx = 0; a.vy = 0; a.spin = 0; a.ang = (seed - 0.5) * 0.9;
    a.seeded = true;
    attachToNearest(a);
  };
  tuck('mitt', 0.80, 0.16, 0.35, -1);
  tuck('mitt2', 0.28, 0.52, 0.72, 1);
  if (packed.length > 2) tuck('mitt', 0.58, 0.88, 0.18, -1);
  tuck('daisy', 0.05, 0.58, 0.90, -1);
  tuck('bean', 0.44, 0.99, 0.50, -1);

  fx.length = 0;
  seeding = false;
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.floor(W * DPR); cvs.height = Math.floor(H * DPR);
  cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
  seedScene();
}

/* ══════════════════════════════════════════════════════════════════════════
   12 · INPUT + UI
   ══════════════════════════════════════════════════════════════════════════ */

const hintEl = document.getElementById('hint');
function silenceHint() { if (hintEl && !hintEl.classList.contains('off')) hintEl.classList.add('off'); }

function toLocal(e) {
  const r = cvs.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

cvs.addEventListener('pointermove', (e) => {
  const p = toLocal(e);
  if (pointer.ghost) { pointer.ghost = false; pointer.x = p.x; pointer.y = p.y; }
  pointer.px = pointer.x; pointer.py = pointer.y;
  pointer.x = p.x; pointer.y = p.y;
  pointer.vx = pointer.x - pointer.px; pointer.vy = pointer.y - pointer.py;
  pointer.speed = Math.hypot(pointer.vx, pointer.vy) * 60;
  pointer.on = true;
  // a jittery or drifting cursor shouldn't count as someone playing, or the
  // poster would never get the stillness it needs to recompose
  if (Math.hypot(pointer.vx, pointer.vy) > 2) touch();
  silenceHint();
});

cvs.addEventListener('pointerdown', (e) => {
  const p = toLocal(e);
  pointer.ghost = false; pointer.on = true; pointer.down = true;
  pointer.x = p.x; pointer.y = p.y;
  touch(); silenceHint();
  pointer.press = 1;
  blast(p.x, p.y, 1);
  cvs.setPointerCapture && cvs.setPointerCapture(e.pointerId);
});

cvs.addEventListener('pointerup', (e) => {
  pointer.down = false;
  if (e.pointerType === 'touch') pointer.on = false;   // no hover on touch, so let the reticle go
});
cvs.addEventListener('pointerleave', () => { pointer.on = false; });
cvs.addEventListener('pointercancel', () => { pointer.down = false; pointer.on = false; });
window.addEventListener('blur', () => { pointer.on = false; pointer.down = false; });

window.addEventListener('keydown', (e) => {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === 'r' || e.key === 'R') { touch(); seedScene(); }
  if (e.key === ' ') { e.preventDefault(); touch(); blast(W / 2, L.floor - L.fs * 1.2, 1.25); silenceHint(); }
});

let rsz;
window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(resize, 140); });
window.addEventListener('orientationchange', () => { clearTimeout(rsz); rsz = setTimeout(resize, 260); });

// ── card / panel
const card = document.getElementById('card');
const chev = document.getElementById('chev');
chev.addEventListener('click', () => {
  const open = card.classList.toggle('open');
  chev.setAttribute('aria-expanded', open ? 'true' : 'false');
  if (open) silenceHint();
});

const phraseEl = document.getElementById('phrase');
phraseEl.value = DEFAULT_PHRASE;
let phraseT;
phraseEl.addEventListener('input', () => {
  clearTimeout(phraseT);
  phraseT = setTimeout(() => {
    phrase = phraseEl.value || DEFAULT_PHRASE;
    layout(); seedScene();
  }, 260);
});

const swEl = document.getElementById('swatches');
Object.keys(PALETTES).forEach((key) => {
  const p = PALETTES[key];
  const b = document.createElement('button');
  b.className = 'sw'; b.type = 'button'; b.title = p.name;
  b.setAttribute('aria-label', p.name);
  b.setAttribute('aria-pressed', key === 'kielm' ? 'true' : 'false');
  [...new Set(p.cols)].slice(0, 5).forEach(c => {
    const i = document.createElement('i'); i.style.background = c; b.appendChild(i);
  });
  b.addEventListener('click', () => {
    PAL = p;
    [...swEl.children].forEach(x => x.setAttribute('aria-pressed', 'false'));
    b.setAttribute('aria-pressed', 'true');
    spriteCache.clear(); blackCache.clear();
    layout(); seedScene();
  });
  swEl.appendChild(b);
});

document.getElementById('btn-reset').addEventListener('click', () => { touch(); seedScene(); silenceHint(); });
document.getElementById('btn-blast').addEventListener('click', () => { touch(); blast(W / 2, L.floor - L.fs * 1.1, 1.3); silenceHint(); });

const soundBtn = document.getElementById('sound');
soundBtn.addEventListener('click', () => {
  if (Sound.on) { Sound.on = false; }
  else if (!Sound.enable()) return;
  soundBtn.setAttribute('aria-pressed', Sound.on ? 'true' : 'false');
  document.getElementById('sound-off').style.display = Sound.on ? 'none' : '';
  document.getElementById('sound-on').style.display = Sound.on ? '' : 'none';
});

document.addEventListener('visibilitychange', () => { if (document.hidden) { pointer.on = false; last = 0; } });

/* ══════════════════════════════════════════════════════════════════════════
   13 · BOOT
   ══════════════════════════════════════════════════════════════════════════ */

function start() {
  resize();
  pointer.ghost = !REDUCED;
  pointer.x = W / 2; pointer.y = -H;     // parked off-stage until the demo loop starts
  requestAnimationFrame(frame);
  // idle-warm the remaining glyph sprites so later knock-outs never hitch
  const warm = () => {
    const pending = L.cells.filter(c => !spriteCache.has(c.ch + '|' + c.color + '|' + L.spriteS));
    if (!pending.length) return;
    const t0 = performance.now();
    while (pending.length && performance.now() - t0 < 9) {
      const c = pending.shift();
      bubbleSprite(c.ch, c.color, L.spriteS);
    }
    (window.requestIdleCallback || requestAnimationFrame)(warm);
  };
  (window.requestIdleCallback || requestAnimationFrame)(warm);
}

if (document.fonts && document.fonts.load) {
  Promise.race([
    Promise.all([
      document.fonts.load('700 100px "Inter"'),
      document.fonts.load('800 100px "Inter"'),
      document.fonts.ready,
    ]),
    new Promise(r => setTimeout(r, 1600)),
  ]).then(start);
} else {
  start();
}

window.__fps = () => ({ fps: Math.round(fpsVal), bodies: bodies.length, sprites: spriteCache.size });

// live tuning handle — handy in the console, used by the build harness
if (location.search.includes('lab')) {
  window.__st = {
    TUNE, L, bodies,
    sprite: bubbleSprite,
    set(k, v) { TUNE[k] = v; this.rebuild(); },
    rebuild() { spriteCache.clear(); fieldCache.clear(); blackCache.clear(); layout(); seedScene(); },
    freeze() { pointer.ghost = false; pointer.on = false; },
  };
}
})();
</script>
