<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brand API loop</title>
</head>
<body style="margin:0;background:#0b0d10;color:#e8eaed;font:14px system-ui">
  <p id="s" style="padding:1rem">Loading Brand API…</p>
  <script>
  (function () {
    var url = "https://cdn.jsdelivr.net/gh/atulkhola/curiosity-demos@1494a8bca93662cb81fef015a52f70efa8eceabd/brand-api/index.html";
    fetch(url).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    }).then(function (html) {
      document.open();
      document.write(html);
      document.close();
    }).catch(function (err) {
      document.getElementById("s").textContent = "Failed to load demo: " + err;
    });
  })();
  </script>
</body>
</html>
